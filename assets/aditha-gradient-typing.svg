<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Aditha Anusara</title>
  <desc id="desc">Aditha Anusara types from left to right over a color-changing blue, purple and teal gradient with layered waves and a glowing white underscore cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#10172c">
        <animate attributeName="stop-color" values="#10172c;#25133f;#0c2935;#10172c" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".48" stop-color="#1d409e">
        <animate attributeName="stop-color" values="#1d409e;#7838ab;#116e83;#1d409e" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2888a7">
        <animate attributeName="stop-color" values="#2888a7;#477bd1;#279c91;#2888a7" dur="18s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="wave-edge">
      <path d="M0 0H1200V230C965 188 820 199 610 218S231 214 0 251Z"/>
    </clipPath>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d1d5d3"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-250%" width="300%" height="600%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g clip-path="url(#wave-edge)">
