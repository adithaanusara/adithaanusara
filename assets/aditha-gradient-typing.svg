    <path d="M0 224C225 239 360 235 600 218S990 192 1200 231V280H0Z" fill="#0d1733" opacity=".32"/>
    <path d="M0 253C240 221 402 235 610 257S1004 250 1200 205V280H0Z" fill="#0d1733" opacity=".4"/>
  </g>
