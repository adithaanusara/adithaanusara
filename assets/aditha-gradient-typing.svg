    <text x="544.8" y="145" opacity="1">&#32;<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.272;.94" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="600.0" y="145" opacity="1">A<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.304;.94" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
    <text x="655.2" y="145" opacity="1">n<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.336;.94" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text>
